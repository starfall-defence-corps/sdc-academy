    <text x="787" y="620" fill="#4ade80" font-size="12" font-weight="600" text-anchor="start">review posted</text>
    <rect x="950" y="376" width="200" height="62" rx="12" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="966" y="403" fill="#e2e8f0" font-size="16" font-weight="700">Review skipped</text><text x="966" y="422" fill="#94a3b8" font-size="12.5">no key · check passes</text>
    <path d="M910 407 H944" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <text x="928" y="398" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">no</text>
    <rect x="950" y="496" width="200" height="62" rx="12" fill="#111a2e" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="966" y="523" fill="#e2e8f0" font-size="16" font-weight="700">Anthropic API</text><text x="966" y="542" fill="#94a3b8" font-size="12.5">files + reviewer prompt</text>
    <path d="M910 516 H944" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)"/>
    <path d="M950 540 H916" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-purple)"/>
    <rect x="950" y="616" width="200" height="62" rx="12" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
    <text x="966" y="643" fill="#e2e8f0" font-size="16" font-weight="700">Review failed</text><text x="966" y="662" fill="#94a3b8" font-size="12.5">API error · check fails</text>
    <path d="M1050 558 V610" fill="none" stroke="#f87171" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-red)"/>
    <text x="1062" y="590" fill="#f87171" font-size="12" font-weight="600" text-anchor="start">error</text>
    <text x="1050" y="700" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">skipped or failed: the</text>
    <text x="1050" y="716" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">comment says so</text>
    <path d="M775 738 V762 H38 V387 H74" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#a-amber)"/>
    <text x="408" y="755" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle">address the feedback, push again</text>
