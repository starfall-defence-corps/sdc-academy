<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">How a mission works</title>
  <desc id="d">On your machine: make doctor, make setup, write Ansible, then make test grades your files and the live Docker lab until every phase is green; make submit opens a pull request in your own copy. On GitHub the ARIA Review workflow runs aria@v1.0.0 without re-running graders. With an ANTHROPIC_API_KEY secret, ARIA sends your workspace files and the mission brief to the Anthropic API and posts one PR comment, updated on each push; without a key the review is skipped, and on an API error the check fails. You address the feedback and push again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14213d"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <marker id="a-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker><marker id="a-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker><marker id="s-indigo" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f87171"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/></marker>
  </defs>
  <rect width="1200" height="800" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="800" rx="18" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="30" y="150" width="540" height="630" rx="18" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.35"/>
    <rect x="303.5" y="160" width="250.5" height="24" rx="12" fill="#fbbf24"/><text x="428.75" y="176.5" fill="#0b1220" font-size="11.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">YOUR MACHINE OR CODESPACE</text>
    <rect x="600" y="150" width="570" height="630" rx="18" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.35"/>
    <rect x="956.9" y="160" width="197.1" height="24" rx="12" fill="#818cf8"/><text x="1055.45" y="176.5" fill="#0b1220" font-size="11.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">YOUR COPY ON GITHUB</text>
    <rect x="40" y="24" width="300" height="62" rx="12" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="56" y="51" fill="#e2e8f0" font-size="16" font-weight="700">Mission template repo</text><text x="56" y="70" fill="#94a3b8" font-size="12.5">starfall-defence-corps/mission-*</text>
    <rect x="500" y="24" width="300" height="62" rx="12" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
    <text x="516" y="51" fill="#e2e8f0" font-size="16" font-weight="700">Your own copy</text><text x="516" y="70" fill="#94a3b8" font-size="12.5">created with Use this template</text>
    <path d="M340 55 H494" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <text x="420" y="46" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Use this template</text>
    <path d="M560 86 V118 H220 V188" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <text x="390" y="110" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">clone, or open a Codespace</text>
    <rect x="80" y="196" width="280" height="62" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="104" cy="227.0" r="13" fill="#fbbf24"/><text x="104" y="231.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="128" y="223" fill="#e2e8f0" font-size="16" font-weight="700">make doctor</text><text x="128" y="242" fill="#94a3b8" font-size="12.5">checks Docker, ports and tools</text>
    <rect x="80" y="286" width="280" height="62" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="104" cy="317.0" r="13" fill="#fbbf24"/><text x="104" y="321.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="128" y="313" fill="#e2e8f0" font-size="16" font-weight="700">make setup</text><text x="128" y="332" fill="#94a3b8" font-size="12.5">venv, SSH key and lab containers</text>
    <rect x="80" y="376" width="280" height="62" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="104" cy="407.0" r="13" fill="#fbbf24"/><text x="104" y="411.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="128" y="403" fill="#e2e8f0" font-size="16" font-weight="700">Write Ansible</text><text x="128" y="422" fill="#94a3b8" font-size="12.5">briefing in docs/, code in workspace/</text>
    <rect x="80" y="466" width="280" height="62" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="104" cy="497.0" r="13" fill="#fbbf24"/><text x="104" y="501.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="128" y="493" fill="#e2e8f0" font-size="16" font-weight="700">make test</text><text x="128" y="512" fill="#94a3b8" font-size="12.5">pytest grader: files and live lab</text>
    <rect x="242" y="455" width="108" height="22" rx="11" fill="#fbbf24"/><text x="296" y="470" fill="#0b1220" font-size="11" font-weight="700" text-anchor="middle">source of truth</text>
    <rect x="80" y="646" width="280" height="62" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="104" cy="677.0" r="13" fill="#fbbf24"/><text x="104" y="681.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">5</text>
    <text x="128" y="673" fill="#e2e8f0" font-size="16" font-weight="700">make submit</text><text x="128" y="692" fill="#94a3b8" font-size="12.5">branch, commit, push, open the PR</text>
    <path d="M220 258 V284" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <path d="M220 348 V374" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <path d="M220 438 V464" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-line)"/>
    <path d="M220 528 V640" fill="none" stroke="#4ade80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-green)"/>
    <text x="232" y="590" fill="#4ade80" font-size="12" font-weight="600" text-anchor="start">all phases green</text>
    <path d="M80 497 H62 V407 H74" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-amber)"/>
    <text x="56" y="452" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 56 452)">fix and re-test</text>
    <rect x="400" y="456" width="150" height="82" rx="12" fill="#111a2e" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="414" y="470" width="38" height="13" rx="3" fill="none" stroke="#fbbf24" stroke-width="2"/><circle cx="421" cy="476.5" r="2.2" fill="#4ade80"/>
    <rect x="414" y="488" width="38" height="13" rx="3" fill="none" stroke="#fbbf24" stroke-width="2"/><circle cx="421" cy="494.5" r="2.2" fill="#4ade80"/>
    <rect x="414" y="506" width="38" height="13" rx="3" fill="none" stroke="#fbbf24" stroke-width="2"/><circle cx="421" cy="512.5" r="2.2" fill="#4ade80"/>
    <text x="462" y="490" fill="#e2e8f0" font-size="15" font-weight="700">Docker lab</text><text x="462" y="508" fill="#94a3b8" font-size="12">target nodes</text><text x="462" y="524" fill="#94a3b8" font-size="12">over SSH</text>
    <path d="M366 497 H394" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" marker-start="url(#s-amber)" marker-end="url(#a-amber)"/>
    <path d="M360 677 H585 V227 H634" fill="none" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-indigo)"/>
    <rect x="640" y="196" width="270" height="62" rx="12" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="664" cy="227.0" r="13" fill="#818cf8"/><text x="664" y="231.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">6</text>
    <text x="688" y="223" fill="#e2e8f0" font-size="16" font-weight="700">Pull request to main</text><text x="688" y="242" fill="#94a3b8" font-size="12.5">opened or updated</text>
    <rect x="640" y="286" width="270" height="62" rx="12" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="664" cy="317.0" r="13" fill="#818cf8"/><text x="664" y="321.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">7</text>
    <text x="688" y="313" fill="#e2e8f0" font-size="16" font-weight="700">ARIA Review workflow</text><text x="688" y="332" fill="#94a3b8" font-size="12.5">aria@v1.0.0 · graders not re-run</text>
    <rect x="640" y="376" width="270" height="62" rx="12" fill="#111a2e" stroke="#818cf8" stroke-width="3"/>
    <circle cx="664" cy="407.0" r="13" fill="#818cf8"/><text x="664" y="411.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">8</text>
    <text x="688" y="403" fill="#e2e8f0" font-size="16" font-weight="700">API key secret set?</text><text x="688" y="422" fill="#94a3b8" font-size="12.5">ANTHROPIC_API_KEY in your repo</text>
    <rect x="640" y="496" width="270" height="62" rx="12" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="664" cy="527.0" r="13" fill="#818cf8"/><text x="664" y="531.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">9</text>
    <text x="688" y="523" fill="#e2e8f0" font-size="16" font-weight="700">ARIA reviews your files</text><text x="688" y="542" fill="#94a3b8" font-size="12.5">your files + mission context</text>
    <rect x="640" y="676" width="270" height="62" rx="12" fill="#111a2e" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="664" cy="707.0" r="13" fill="#818cf8"/><text x="664" y="711.5" fill="#0b1220" font-size="13" font-weight="700" text-anchor="middle">10</text>
    <text x="688" y="703" fill="#e2e8f0" font-size="16" font-weight="700">One ARIA comment per PR</text><text x="688" y="722" fill="#94a3b8" font-size="12.5">created once, updated on each push</text>
    <path d="M775 258 V280" fill="none" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-indigo)"/>
    <path d="M775 348 V370" fill="none" stroke="#818cf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a-indigo)"/>
